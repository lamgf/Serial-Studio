name: Windows GPL Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  QT_USERNAME: "jianyuliu@protonmail.com"
  QT_PASSWORD: "fuckyouqtfuckyouqt"

  QT_VERSION_WINDOWS: "6.11.2"
  QTFRAMEWORK_BYPASS_LICENSE_CHECK: "true"

jobs:
  build-windows-gpl:
    runs-on: windows-latest
    name: 'Windows GPLv3 Build (x86_64)'
    permissions:
      contents: read
    steps:
    - name: 'Checkout'
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        submodules: 'recursive'

    #
    # 把脚本原文打印出来，看它到底读哪些环境变量
    #
    - name: 'Diagnose 1: dump install-qt.ps1'
      shell: pwsh
      run: |
        Write-Host "==================== install-qt.ps1 ===================="
        Get-Content ./scripts/install-qt.ps1
        Write-Host "========================================================"

    #
    # 安装 Qt，并保留完整输出
    #
    - name: 'Install Qt (online installer)'
      shell: pwsh
      env:
        QT_VERSION: ${{ env.QT_VERSION_WINDOWS }}
        QT_ARCH: x64
        QT_OUTPUT_DIR: ${{ github.workspace }}/Qt-${{ env.QT_VERSION_WINDOWS }}-${{ runner.os }}-x64
      run: |
        Write-Host "calling ./scripts/install-qt.ps1 with:"
        Write-Host "  QT_VERSION    = $env:QT_VERSION"
        Write-Host "  QT_ARCH       = $env:QT_ARCH"
        Write-Host "  QT_OUTPUT_DIR = $env:QT_OUTPUT_DIR"
        ./scripts/install-qt.ps1
        Write-Host "script exit code = $LASTEXITCODE"

    #
    # Qt 到底装哪儿了：全盘搜索
    #
    - name: 'Diagnose 2: find Qt6Config.cmake anywhere'
      shell: pwsh
      run: |
        $roots = @(
          "${{ github.workspace }}",
          "D:\a",
          "C:\Qt",
          "$env:RUNNER_TEMP",
          "$env:USERPROFILE"
        ) | Select-Object -Unique

        foreach ($r in $roots) {
          if (-not (Test-Path $r)) { continue }
          Write-Host "---- searching under $r ----"
          Get-ChildItem $r -Recurse -Filter Qt6Config.cmake -ErrorAction SilentlyContinue |
            Select-Object -First 20 -ExpandProperty FullName
        }

    #
    # 打印所有 QT_* 变量，确认脚本有没有回写什么 
    #
    - name: 'Diagnose 3: QT_* env vars'
      shell: pwsh
      run: |
        Get-ChildItem env: | Where-Object { $_.Name -like 'QT*' } |
          Sort-Object Name | Format-Table -AutoSize | Out-String | Write-Host

    - name: 'Install CMake'
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        useLocalCache: false
        useCloudCache: false

    - name: 'Setup MSVC Development Environment'
      uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
      with:
        arch: x64
