name: Windows GPL Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  #
  # Qt 账号（明文）
  #
  QT_USERNAME: "jianyuliu@protonmail.com"
  QT_PASSWORD: "fuckyouqtfuckyouqt"

  #
  # 与上游 CI 的 QT_VERSION_WINDOWS 保持一致（该版本 aqt 拿不到，只能用官方在线安装器）
  #
  QT_VERSION_WINDOWS: "6.11.2"
  QTFRAMEWORK_BYPASS_LICENSE_CHECK: "true"

jobs:
  build-windows-gpl:
    runs-on: windows-latest
    name: 'Windows GPLv3 Build (x86_64)'
    permissions:
      contents: read
    steps:
    - name: 'Checkout'
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        submodules: 'recursive'

    #
    # 恢复 Qt 缓存（含 Qt 账号凭据文件 ~/.qt-license）
    #
    - name: 'Restore Qt cache'
      id: qt_cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ github.workspace }}/Qt-${{ env.QT_VERSION_WINDOWS }}-${{ runner.os }}-x64
          ~/.qt-license
        key: qt-${{ runner.os }}-${{ env.QT_VERSION_WINDOWS }}-x64-msvc2022_64-v2

    #
    # 缓存未命中时才安装：Qt 官方在线安装器 + Qt 账号
    # 依赖仓库内的 scripts/install-qt.ps1
    #
    - name: 'Install Qt (cache miss)'
      if: steps.qt_cache.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        QT_VERSION: ${{ env.QT_VERSION_WINDOWS }}
        QT_ARCH: x64
        QT_OUTPUT_DIR: ${{ github.workspace }}/Qt-${{ env.QT_VERSION_WINDOWS }}-${{ runner.os }}-x64
      run: |
        ./scripts/install-qt.ps1

    #
    # 缓存未命中时写回缓存，键名与 restore 保持一致
    #
    - name: 'Save Qt cache'
      if: steps.qt_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ github.workspace }}/Qt-${{ env.QT_VERSION_WINDOWS }}-${{ runner.os }}-x64
          ~/.qt-license
        key: qt-${{ runner.os }}-${{ env.QT_VERSION_WINDOWS }}-x64-msvc2022_64-v2

    #
    # 通过 GITHUB_PATH / GITHUB_ENV 发布 bin、libexec、CMAKE_PREFIX_PATH，
    # 后续步骤共用同一套 Qt
    #
    - name: 'Add Qt to PATH'
      shell: pwsh
      env:
        QT_VERSION: ${{ env.QT_VERSION_WINDOWS }}
        QT_OUTPUT_DIR: ${{ github.workspace }}/Qt-${{ env.QT_VERSION_WINDOWS }}-${{ runner.os }}-x64
      run: |
        $QT_BIN_PATH = "$env:QT_OUTPUT_DIR\$env:QT_VERSION\msvc2022_64\bin"
        $QT_LIBEXEC_PATH = "$env:QT_OUTPUT_DIR\$env:QT_VERSION\msvc2022_64\libexec"
        $CMAKE_PREFIX_PATH = "$env:QT_OUTPUT_DIR\$env:QT_VERSION\msvc2022_64\lib\cmake"
        Write-Output "$QT_BIN_PATH" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Write-Output "$QT_LIBEXEC_PATH" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Write-Output "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" >> $env:GITHUB_ENV

    #
    # 确认 app/CMakeLists.txt 要求的组件都在（GuiPrivate / Svg 是前面报错的两个）
    #
    - name: 'Verify Qt packages (debug)'
      shell: pwsh
      run: |
        Write-Host "CMAKE_PREFIX_PATH = $env:CMAKE_PREFIX_PATH"
        foreach ($p in 'Qt6GuiPrivate','Qt6Svg','Qt6LinguistTools','Qt6Graphs','Qt6Bluetooth','Qt6SerialPort','Qt6Core5Compat') {
          Write-Host "$p = $(Test-Path "$env:CMAKE_PREFIX_PATH\$p\${p}Config.cmake")"
        }

    - name: 'Install CMake'
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        useLocalCache: false
        useCloudCache: false

    - name: 'Setup MSVC Development Environment'
      uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
      with:
        arch: x64

    - name: 'Configure (GPLv3, no PGO, no gRPC, no WebEngine)'
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_GPL3=ON `
          -DBUILD_COMMERCIAL=OFF `
          -DENABLE_GRPC=OFF `
          -DWITH_WEBENGINE=OFF `
          -DSS_USE_MIMALLOC=OFF `
          -DSS_PACKAGE_TYPE=msi

    - name: 'Build application'
      run: cmake --build build --config Release

    - name: 'Add msbuild to PATH'
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: 'Install WiX'
      run: dotnet tool install --global wix

    - name: 'Create MSI installer'
      run: |
        cd build
        cpack --verbose
        $msi = Get-ChildItem *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($msi) { Move-Item $msi.FullName "../Serial-Studio-GPL-Windows.msi" }

    - name: 'Create portable ZIP'
      shell: bash
      run: |
        cd build
        cpack -G TGZ || true
        TGZ=$(ls *.tar.gz 2>/dev/null | head -1)
        if [ -n "$TGZ" ]; then
          7z x "$TGZ"
          DIRNAME=$(tar -tf "$TGZ" | head -1 | cut -f1 -d"/")
          7z a "../Serial-Studio-GPL-Windows-Portable.zip" "$DIRNAME"/*
        fi

    - name: 'Upload MSI'
      uses: actions/upload-artifact@v4
      with:
        name: Serial-Studio-GPL-Windows-MSI
        path: Serial-Studio-GPL-Windows.msi
        if-no-files-found: ignore

    - name: 'Upload Portable ZIP'
      uses: actions/upload-artifact@v4
      with:
        name: Serial-Studio-GPL-Windows-Portable
        path: Serial-Studio-GPL-Windows-Portable.zip
        if-no-files-found: ignore
