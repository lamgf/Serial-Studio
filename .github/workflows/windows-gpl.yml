name: Windows GPL Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  #
  # 先按探针结果改这个值：如果公开仓库里有 6.11.2 就用 6.11.2
  #
  QT_VERSION: "6.11.2"

jobs:
  build-windows-gpl:
    runs-on: windows-latest
    name: 'Windows GPLv3 Build (x86_64)'
    permissions:
      contents: read
    steps:
    - name: 'Checkout'
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        submodules: 'recursive'

    #
    # aqt 走公开仓库，不需要 Qt 账号
    # 关键：不要写 archives:，否则基础包被白名单截断（Svg / GuiPrivate 就是这么丢的）
    #
    - name: 'Install Qt (aqt, no account needed)'
      id: qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtgraphs qtconnectivity qtserialport qt5compat'
        cache: false

    - name: 'Verify Qt packages (debug)'
      shell: pwsh
      run: |
        Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"
        foreach ($p in 'Qt6GuiPrivate','Qt6Svg','Qt6LinguistTools','Qt6Graphs','Qt6Bluetooth','Qt6SerialPort','Qt6Core5Compat') {
          Write-Host "$p = $(Test-Path "$env:QT_ROOT_DIR\lib\cmake\$p\${p}Config.cmake")"
        }

    - name: 'Install CMake'
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        useLocalCache: false
        useCloudCache: false

    - name: 'Setup MSVC Development Environment'
      uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
      with:
        arch: x64

    - name: 'Configure (GPLv3, no PGO, no gRPC, no WebEngine)'
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
          -DBUILD_GPL3=ON `
          -DBUILD_COMMERCIAL=OFF `
          -DENABLE_GRPC=OFF `
          -DWITH_WEBENGINE=OFF `
          -DSS_USE_MIMALLOC=OFF `
          -DSS_PACKAGE_TYPE=msi

    - name: 'Build application'
      run: cmake --build build --config Release

    - name: 'Add msbuild to PATH'
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: 'Install WiX'
      run: dotnet tool install --global wix

    - name: 'Create MSI installer'
      run: |
        cd build
        cpack --verbose
        $msi = Get-ChildItem *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($msi) { Move-Item $msi.FullName "../Serial-Studio-GPL-Windows.msi" }

    - name: 'Create portable ZIP'
      shell: bash
      run: |
        cd build
        cpack -G TGZ || true
        TGZ=$(ls *.tar.gz 2>/dev/null | head -1)
        if [ -n "$TGZ" ]; then
          7z x "$TGZ"
          DIRNAME=$(tar -tf "$TGZ" | head -1 | cut -f1 -d"/")
          7z a "../Serial-Studio-GPL-Windows-Portable.zip" "$DIRNAME"/*
        fi

    - name: 'Upload MSI'
      uses: actions/upload-artifact@v4
      with:
        name: Serial-Studio-GPL-Windows-MSI
        path: Serial-Studio-GPL-Windows.msi
        if-no-files-found: ignore

    - name: 'Upload Portable ZIP'
      uses: actions/upload-artifact@v4
      with:
        name: Serial-Studio-GPL-Windows-Portable
        path: Serial-Studio-GPL-Windows-Portable.zip
        if-no-files-found: ignore
