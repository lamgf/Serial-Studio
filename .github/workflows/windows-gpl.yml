name: Windows GPL Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build-windows-gpl:
    runs-on: windows-latest
    name: 'Windows GPLv3 Build (x86_64)'
    permissions:
      contents: read
    steps:
    - name: 'Checkout'
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: 'Set up Python (for aqtinstall)'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    - name: 'Install aqtinstall'
      run: pip install aqtinstall

    - name: 'Install Qt 6.8.3 (open source, MSVC 2022 x64)'
      run: |
        python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 `
          --outputdir "${{ github.workspace }}\Qt"

    - name: 'Add Qt to PATH'
      shell: pwsh
      run: |
        $qtBin = "${{ github.workspace }}\Qt\6.8.3\msvc2022_64\bin"
        $qtLibexec = "${{ github.workspace }}\Qt\6.8.3\msvc2022_64\libexec"
        $qtCmake = "${{ github.workspace }}\Qt\6.8.3\msvc2022_64\lib\cmake"
        Write-Output "$qtBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Write-Output "$qtLibexec" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Write-Output "CMAKE_PREFIX_PATH=$qtCmake" >> $env:GITHUB_ENV

    - name: 'Install CMake'
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        useLocalCache: false
        useCloudCache: false

    - name: 'Setup MSVC Development Environment'
      uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
      with:
        arch: x64

    - name: 'Configure (GPLv3, no PGO, no gRPC, no WebEngine)'
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_GPL3=ON `
          -DBUILD_COMMERCIAL=OFF `
          -DENABLE_GRPC=OFF `
          -DWITH_WEBENGINE=OFF `
          -DSS_USE_MIMALLOC=OFF `
          -DSS_PACKAGE_TYPE=msi

    - name: 'Build application'
      run: cmake --build build --config Release

    - name: 'Add msbuild to PATH'
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: 'Install WiX'
      run: dotnet tool install --global wix

    - name: 'Create MSI installer'
      run: |
        cd build
        cpack --verbose
        $msi = Get-ChildItem *.msi | Select-Object -First 1
        if ($msi) { Move-Item $msi.FullName "../Serial-Studio-GPL-Windows.msi" }

    - name: 'Create portable ZIP'
      shell: bash
      run: |
        cd build
        cpack -G TGZ
        TGZ=$(ls *.tar.gz | head -1)
        7z x "$TGZ"
        DIRNAME=$(tar -tf "$TGZ" | head -1 | cut -f1 -d"/")
        7z a "../Serial-Studio-GPL-Windows-Portable.zip" "$DIRNAME"/*

    - name: 'Upload MSI'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: Serial-Studio-GPL-Windows-MSI
        path: Serial-Studio-GPL-Windows.msi
        if-no-files-found: ignore

    - name: 'Upload Portable ZIP'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: Serial-Studio-GPL-Windows-Portable
        path: Serial-Studio-GPL-Windows-Portable.zip
        if-no-files-found: ignore
