name: Windows GPL Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build-windows-gpl:
    runs-on: windows-latest
    name: 'Windows GPLv3 Build (x86_64)'
    permissions:
      contents: read
    steps:
    - name: 'Checkout'
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: 'Install Qt 6.8.3 (open source, MSVC 2022 x64)'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtgraphs qtcharts qtserialport qtserialbus qtmultimedia qtimageformats qtquick3d qtquicktimeline qtshadertools qt5compat qtconnectivity'
        cache: true

    - name: 'Install CMake'
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        useLocalCache: false
        useCloudCache: false

    - name: 'Setup MSVC Development Environment'
      uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
      with:
        arch: x64

    - name: 'Configure (GPLv3, no PGO, no gRPC, no WebEngine)'
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_GPL3=ON `
          -DBUILD_COMMERCIAL=OFF `
          -DENABLE_GRPC=OFF `
          -DWITH_WEBENGINE=OFF `
          -DSS_USE_MIMALLOC=OFF `
          -DSS_PACKAGE_TYPE=msi

    - name: 'Build application'
      run: cmake --build build --config Release

    - name: 'Add msbuild to PATH'
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: 'Install WiX'
      run: dotnet tool install --global wix

    - name: 'Create MSI installer'
      run: |
        cd build
        cpack --verbose
        $msi = Get-ChildItem *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($msi) { Move-Item $msi.FullName "../Serial-Studio-GPL-Windows.msi" }

    - name: 'Create portable ZIP'
      shell: bash
      run: |
        cd build
        cpack -G TGZ || true
        TGZ=$(ls *.tar.gz 2>/dev/null | head -1)
        if [ -n "$TGZ" ]; then
          7z x "$TGZ"
          DIRNAME=$(tar -tf "$TGZ" | head -1 | cut -f1 -d"/")
          7z a "../Serial-Studio-GPL-Windows-Portable.zip" "$DIRNAME"/*
        fi

    - name: 'Upload MSI'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: Serial-Studio-GPL-Windows-MSI
        path: Serial-Studio-GPL-Windows.msi
        if-no-files-found: ignore

    - name: 'Upload Portable ZIP'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: Serial-Studio-GPL-Windows-Portable
        path: Serial-Studio-GPL-Windows-Portable.zip
        if-no-files-found: ignore
